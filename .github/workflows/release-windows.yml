# release-windows: Windows beta (x64, UNSIGNED for now; SmartScreen will warn) zipped and attached to the GitHub Release v<version>.
{name: release-windows, on: {workflow_dispatch: {}}, permissions: {contents: write}, jobs: {win: {runs-on: windows-latest, steps: [{uses: actions/checkout@v4}, {uses: subosito/flutter-action@v2, with: {channel: stable}}, {shell: bash, run: "pip install --quiet pillow && python tool/gen_icons.py"}, {shell: bash, run: "flutter pub get && flutter build windows --release"}, {name: Attach to GitHub Release, shell: bash, env: {GH_TOKEN: "${{ github.token }}"}, run: "set -euo pipefail; V=$(grep '^version:' pubspec.yaml | cut -d' ' -f2 | cut -d+ -f1); mkdir -p dist; cp -r build/windows/x64/runner/Release dist/KOINIkeyview; (cd dist && 7z a -tzip KOINIkeyview-$V-windows.zip KOINIkeyview >/dev/null); ls -la dist; gh release view v$V --repo $GITHUB_REPOSITORY >/dev/null 2>&1 || gh release create v$V --repo $GITHUB_REPOSITORY --title \"KOINIkeyview $V\" --notes \"Beta builds.\" --target $GITHUB_SHA; gh release upload v$V dist/KOINIkeyview-$V-windows.zip --repo $GITHUB_REPOSITORY --clobber"}]}}}
