# release-android: Android beta APK (arm64, debug-signed sideload) attached to the GitHub Release v<version>, same as the Mac DMG.
{name: release-android, on: {workflow_dispatch: {}}, permissions: {contents: write}, jobs: {apk: {runs-on: ubuntu-latest, steps: [{uses: actions/checkout@v4}, {uses: actions/setup-java@v4, with: {distribution: temurin, java-version: "17"}}, {uses: subosito/flutter-action@v2, with: {channel: stable}}, {run: "pip3 install --quiet --break-system-packages pillow && python3 tool/gen_icons.py"}, {run: "flutter pub get && flutter build apk --release --split-per-abi"}, {name: Attach to GitHub Release, env: {GH_TOKEN: "${{ github.token }}"}, run: "set -euo pipefail; V=$(grep '^version:' pubspec.yaml | cut -d' ' -f2 | cut -d+ -f1); mkdir -p dist; cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk dist/KOINIkeyview-$V.apk; (cd dist && zip -q KOINIkeyview-$V-android.zip KOINIkeyview-$V.apk); ls -la dist; gh release view v$V --repo $GITHUB_REPOSITORY >/dev/null 2>&1 || gh release create v$V --repo $GITHUB_REPOSITORY --title \"KOINIkeyview $V\" --notes \"Beta builds.\" --target $GITHUB_SHA; gh release upload v$V dist/KOINIkeyview-$V-android.zip --repo $GITHUB_REPOSITORY --clobber"}]}}}
