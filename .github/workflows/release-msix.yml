# release-msix: store-signed MSIX package for the Microsoft Store, attached to GitHub Release v<version>.
name: release-msix
on:
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  msix:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Generate app icons
        shell: bash
        run: pip install --quiet pillow && python tool/gen_icons.py
      - name: Build Windows release
        shell: bash
        run: flutter pub get && flutter build windows --release
      - name: Capture Windows store screenshot
        continue-on-error: true
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Windows.Forms,System.Drawing
          $exe = (Get-ChildItem build/windows/x64/runner/Release -Filter *.exe | Select-Object -First 1).FullName
          Start-Process $exe
          Start-Sleep -Seconds 30
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $b = New-Object System.Drawing.Bitmap 1920,1080
          $g = [System.Drawing.Graphics]::FromImage($b)
          $g.CopyFromScreen(0,0,0,0,$b.Size)
          $out = Join-Path $PWD dist/windows-screenshot-1.png
          $b.Save($out,[System.Drawing.Imaging.ImageFormat]::Png)
          Get-ChildItem dist
      - name: Build store MSIX
        shell: bash
        run: |
          set -euo pipefail
          V=$(grep ^version: pubspec.yaml | cut -d" " -f2 | cut -d+ -f1)
          mkdir -p dist
          printf '\nmsix_config:\n  display_name: KOINIkeyview\n  publisher_display_name: KOINI\n  identity_name: KOINI.KOINIkeyview\n  publisher: CN=B14603CF-6386-4059-8942-9C561F392904\n  msix_version: %s.0\n  logo_path: macos/Runner/Assets.xcassets/AppIcon.appiconset/app_icon_1024.png\n  capabilities: internetClient\n  store: true\n  output_path: dist\n  output_name: KOINIkeyview-%s\n' "$V" "$V" >> pubspec.yaml
          tail -n 15 pubspec.yaml
          dart pub global activate msix
          dart pub global run msix:create --store
          ls -la dist
      - name: Attach MSIX to GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          V=$(git show HEAD:pubspec.yaml | grep ^version: | cut -d" " -f2 | cut -d+ -f1)
          gh release view v$V --repo $GITHUB_REPOSITORY >/dev/null 2>&1 || gh release create v$V --repo $GITHUB_REPOSITORY --title "KOINIkeyview $V" --notes "Beta builds." --target $GITHUB_SHA
          gh release upload v$V dist/KOINIkeyview-$V.msix --repo $GITHUB_REPOSITORY --clobber
          if [ -f dist/windows-screenshot-1.png ]; then gh release upload v$V dist/windows-screenshot-1.png --repo $GITHUB_REPOSITORY --clobber; fi
