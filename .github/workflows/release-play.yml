# release-play: signed Android App Bundle (AAB) for Google Play, attached to GitHub Release v<version>.
name: release-play
on:
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  aab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Restore upload keystore
        env:
          UPLOAD_KEYSTORE: ${{ secrets.ANDROID_UPLOAD_KEYSTORE }}
        run: |
          set -euo pipefail
          test -n "$UPLOAD_KEYSTORE"
          PW=$(printf %s "$UPLOAD_KEYSTORE" | head -1 | tr -d "\r")
          printf %s "$UPLOAD_KEYSTORE" | tail -n +2 | tr -d "\r\n" | base64 -d > android/app/upload-keystore.jks
          printf "storePassword=%s\nkeyPassword=%s\nkeyAlias=upload\nstoreFile=upload-keystore.jks\n" "$PW" "$PW" > android/key.properties
          ls -l android/app/upload-keystore.jks
      - run: pip3 install --quiet --break-system-packages pillow && python3 tool/gen_icons.py
      - run: flutter pub get && flutter build appbundle --release
      - name: Attach AAB to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          V=$(grep "^version:" pubspec.yaml | cut -d" " -f2 | cut -d+ -f1)
          mkdir -p dist
          cp build/app/outputs/bundle/release/app-release.aab dist/KOINIkeyview-$V.aab
          ls -la dist
          gh release view v$V --repo $GITHUB_REPOSITORY >/dev/null 2>&1 || gh release create v$V --repo $GITHUB_REPOSITORY --title "KOINIkeyview $V" --notes "Beta builds." --target $GITHUB_SHA
          gh release upload v$V dist/KOINIkeyview-$V.aab --repo $GITHUB_REPOSITORY --clobber
      - name: Clean up signing material
        if: always()
        run: rm -f android/app/upload-keystore.jks android/key.properties
