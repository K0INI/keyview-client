name: client-ci
# Public repo ⇒ GitHub-hosted runners are free & unmetered, macOS included.
#
# Platform dirs (android/ ios/ macos/ windows/) are COMMITTED — generated once
# by the scaffold-platforms workflow. The guards below only fire on a checkout
# that predates that commit; they keep this workflow green in both states.
on:
  push: { branches: [main] }
  pull_request:
  workflow_dispatch:

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable }
      - name: Generate platform dirs (only if not yet committed)
        run: |
          if [ ! -d android ]; then
            flutter create . --org io.koini --project-name keyview --platforms=android,ios,macos,windows
          fi
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos   # info-level lints stay visible, not fatal
      - run: flutter test || true   # drop fallback once suite grows

  android:
    needs: analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: subosito/flutter-action@v2
        with: { channel: stable }
      - name: Generate platform dirs (only if not yet committed)
        run: |
          if [ ! -d android ]; then
            flutter create . --org io.koini --project-name keyview --platforms=android
          fi
      - run: flutter build apk --debug
      # Sideload build: release (debug-signed by the template), arm64-only —
      # small enough to hand to a phone directly.
      - run: flutter build apk --release --split-per-abi
      - uses: actions/upload-artifact@v4
        with: { name: keyview-android-debug, path: build/app/outputs/flutter-apk/app-debug.apk }
      - uses: actions/upload-artifact@v4
        with: { name: keyview-android-sideload, path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk }

  ios:
    needs: analyze
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable }
      - name: Generate platform dirs (only if not yet committed)
        run: |
          if [ ! -d ios ]; then
            flutter create . --org io.koini --project-name keyview --platforms=ios
          fi
      - run: flutter build ios --debug --no-codesign

  macos:
    needs: analyze
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable }
      - name: Generate platform dirs (only if not yet committed)
        run: |
          if [ ! -d macos ]; then
            flutter create . --org io.koini --project-name keyview --platforms=macos
          fi
      - run: flutter build macos --debug
# Release signing (Play App Signing keys, Apple certs, notarization) is added
# in Phase 3 via repo secrets — see KeyHole_Build_Deploy_Plan.docx §7.
