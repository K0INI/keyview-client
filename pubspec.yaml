name: keyview
description: "KŌINIkeyview — view-only crypto wallet tracker. Eyes on. Keys off."
publish_to: "none"
version: 0.1.1+2

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  # Push. Ranges are deliberately wide so pub can pick whatever is compatible
  # with the pinned Dart SDK rather than failing to resolve on a hard pin.
  firebase_core: '>=3.6.0 <5.0.0'
  firebase_messaging: '>=15.1.0 <17.0.0'
  # Desktop banners (macOS local notifications — no APNs needed).
  flutter_local_notifications: '>=17.0.0 <20.0.0'
  google_fonts: ^6.2.1
  http: ^1.2.0
  intl: ^0.19.0
  shared_preferences: ^2.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
